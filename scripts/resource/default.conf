# LayerToll reverse proxy (modified from the upstream XPack default.conf, Apache-2.0).
#   /                 -> Next.js frontend       :3000
#   /api, /uploads    -> admin service          :8001
#   /mcp              -> upstream MCP endpoints :8002 (API-key + wallet billing)
#   /a2mcp, /agent-mcp -> agent gateway :8002 (x402 on X Layer)
#   The demo business API (/demo-api on :8002) is deliberately NOT exposed:
#   agents must go through the paid gateway, which calls it on 127.0.0.1.

map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
}

server {
        listen 80 default_server;
        listen [::]:80 default_server;
        client_max_body_size 12m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control no-cache;

        location ^~ /api      { proxy_pass http://127.0.0.1:8001; }
        location ^~ /uploads  { proxy_pass http://127.0.0.1:8001; }

        location ^~ /mcp       { proxy_pass http://127.0.0.1:8002; proxy_buffering off; proxy_read_timeout 3600s; }
        location ^~ /a2mcp     { proxy_pass http://127.0.0.1:8002; proxy_read_timeout 120s; }
        location ^~ /agent-mcp { proxy_pass http://127.0.0.1:8002; proxy_buffering off; proxy_read_timeout 300s; }

        location / { proxy_pass http://127.0.0.1:3000; }
}
