# LayerToll local / single-host deployment.
#   python scripts/generate_env.py      # creates .env with random local passwords
#   docker compose up -d --build
#   open http://localhost:8000/admin     (admin / 123456789 — upstream default, change it)
# All credentials come from .env; nothing secret is committed.
name: layertoll

services:
  mysql:
    image: mysql:8.0.37
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-layertoll}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]

  rabbitmq:
    image: rabbitmq:4.1.2-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-layertoll}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  app:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    image: layertoll:local
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${LAYERTOLL_PORT:-8000}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
