# Non-root nginx for the Hugging Face Space (port 7860). Same routing as
# scripts/resource/default.conf; the demo business API is not exposed.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 12m;

    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    server {
        listen 7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /health     { proxy_pass http://127.0.0.1:8002/health; }
        location ^~ /api       { proxy_pass http://127.0.0.1:8001; }
        location ^~ /uploads   { proxy_pass http://127.0.0.1:8001; }
        location ^~ /mcp       { proxy_pass http://127.0.0.1:8002; proxy_buffering off; proxy_read_timeout 3600s; }
        location ^~ /a2mcp     { proxy_pass http://127.0.0.1:8002; proxy_read_timeout 120s; }
        location ^~ /agent-mcp { proxy_pass http://127.0.0.1:8002; proxy_buffering off; proxy_read_timeout 300s; }
        location / { proxy_pass http://127.0.0.1:3000; }
    }
}
